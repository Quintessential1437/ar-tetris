<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>AR Tetris</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://libs.zappar.com/zappar-threejs/2.4.6/zappar-threejs.js"></script>
</head>
<body>
<div id="hud"><div><b>AR TETRIS</b><span id="status">Point at a wall</span></div><div>Score <b id="score">0</b></div></div>
<div id="controls"><button id="left">◀</button><button id="rotate">↻</button><button id="right">▶</button><button id="drop">▼</button></div>
<button id="place">TAP TO PLACE</button>
<div id="error" hidden></div>
<script src="game.js"></script>
</body>
</html>
